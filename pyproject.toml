[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-ai-guardian"
version = "0.1.0"
description = "Reliability and integrity monitoring for soft sensors in closed-loop process plants"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyarrow>=14",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "asyncua>=1.1",
    "cryptography>=42",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx2>=2", "bandit>=1.7", "pip-audit>=2.7"]

[tool.setuptools]
packages = ["guardian", "dashboard"]

[tool.setuptools.package-data]
dashboard = ["static/*", "static/vendor/*", "static/fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
