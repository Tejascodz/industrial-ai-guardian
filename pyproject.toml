[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-ai-guardian"
version = "0.2.0"
description = "Reliability and integrity monitoring for soft sensors in closed-loop process plants"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyarrow>=14",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "asyncua>=1.1",
    "cryptography>=42",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx2>=2", "bandit>=1.7", "pip-audit>=2.7", "ruff>=0.16"]

[tool.setuptools]
packages = ["guardian", "dashboard"]

[tool.setuptools.package-data]
dashboard = ["static/*", "static/vendor/*", "static/fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["sim", "dashboard/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]  # bandit runs on the shipped code; tests build fixtures freely
