<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="bt bd">
  <title id="bt">Industrial AI Guardian</title>
  <desc id="bd">Field transmitters for flow, level, temperature and pressure feed Guardian, which sorts every alarm into one of four verdicts: transmitter fault with the transmitter named, process fault, regime change, or integrity attack.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/>
    </marker>
    <style>
      .tag { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
      .num { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #57606a; }
      .lbl { font-size: 14px; fill: #57606a; }
      .chip { font-size: 15px; font-weight: 600; }
      .sub { font-size: 12.5px; fill: #57606a; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="330" rx="14" fill="#f6f8fa"/>
  <rect x="0.5" y="0.5" width="1199" height="329" rx="14" fill="none" stroke="#d8dee4"/>

  <!-- field transmitters (ISA-5.1 style instrument bubbles) -->
  <text class="lbl" x="60" y="52">Field transmitters</text>
  <g>
    <circle cx="96" cy="104" r="30" fill="#fff" stroke="#57606a" stroke-width="1.6"/>
    <line x1="66" y1="104" x2="126" y2="104" stroke="#57606a" stroke-width="1.2"/>
    <text class="tag" x="96" y="99" text-anchor="middle">FIC</text>
    <text class="num" x="96" y="120" text-anchor="middle">102</text>

    <circle cx="96" cy="184" r="30" fill="#fff" stroke="#57606a" stroke-width="1.6"/>
    <line x1="66" y1="184" x2="126" y2="184" stroke="#57606a" stroke-width="1.2"/>
    <text class="tag" x="96" y="179" text-anchor="middle">LIC</text>
    <text class="num" x="96" y="200" text-anchor="middle">112</text>

    <circle cx="96" cy="264" r="30" fill="#fff" stroke="#57606a" stroke-width="1.6"/>
    <line x1="66" y1="264" x2="126" y2="264" stroke="#57606a" stroke-width="1.2"/>
    <text class="tag" x="96" y="259" text-anchor="middle">TIC</text>
    <text class="num" x="96" y="280" text-anchor="middle">109</text>

    <circle cx="196" cy="144" r="30" fill="#fff" stroke="#2563eb" stroke-width="2.4"/>
    <circle cx="196" cy="144" r="37" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4 4"/>
    <line x1="166" y1="144" x2="226" y2="144" stroke="#2563eb" stroke-width="1.2"/>
    <text class="tag" x="196" y="139" text-anchor="middle" fill="#2563eb">TI</text>
    <text class="num" x="196" y="160" text-anchor="middle">118</text>

    <circle cx="196" cy="234" r="30" fill="#fff" stroke="#57606a" stroke-width="1.6"/>
    <line x1="166" y1="234" x2="226" y2="234" stroke="#57606a" stroke-width="1.2"/>
    <text class="tag" x="196" y="229" text-anchor="middle">PIC</text>
    <text class="num" x="196" y="250" text-anchor="middle">107</text>
  </g>

  <path d="M250 184 H318" stroke="#8c959f" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text class="sub" x="254" y="172">read-only</text>

  <!-- Guardian block -->
  <rect x="326" y="74" width="330" height="220" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="352" y="118" font-size="30" font-weight="700" fill="#1f2328">Industrial AI</text>
  <text x="352" y="154" font-size="30" font-weight="700" fill="#2563eb">Guardian</text>
  <text class="sub" x="352" y="190">virtual sensor bank and reconstruction test</text>
  <text class="sub" x="352" y="210">closed-loop fault signatures</text>
  <text class="sub" x="352" y="230">instrument and integrity checks</text>
  <text class="sub" x="352" y="250">DCS setpoint context</text>
  <text class="sub" x="352" y="270">protected soft sensor</text>

  <!-- verdicts -->
  <text class="lbl" x="742" y="52">Every alarm gets one verdict</text>
  <path d="M656 184 H700 V96 H736" stroke="#8c959f" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <path d="M700 184 V156 H736" stroke="#8c959f" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <path d="M700 184 V216 H736" stroke="#8c959f" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <path d="M700 184 V276 H736" stroke="#8c959f" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <path d="M656 184 H700" stroke="#8c959f" stroke-width="1.6" fill="none"/>

  <rect x="742" y="72" width="418" height="48" rx="10" fill="#dbe7fe" stroke="#2563eb"/>
  <text class="chip" x="762" y="102" fill="#1e40af">Transmitter fault</text>
  <text class="sub" x="912" y="102">and which one: TI-118 is wrong</text>

  <rect x="742" y="132" width="418" height="48" rx="10" fill="#fff" stroke="#d0d7de"/>
  <text class="chip" x="762" y="162" fill="#1f2328">Process fault</text>
  <text class="sub" x="912" y="162">the plant really changed</text>

  <rect x="742" y="192" width="418" height="48" rx="10" fill="#fff" stroke="#d0d7de"/>
  <text class="chip" x="762" y="222" fill="#1f2328">Regime change</text>
  <text class="sub" x="912" y="222">an operator moved a setpoint</text>

  <rect x="742" y="252" width="418" height="48" rx="10" fill="#fff" stroke="#d0d7de"/>
  <text class="chip" x="762" y="282" fill="#1f2328">Integrity attack</text>
  <text class="sub" x="912" y="282">the data was replayed or frozen</text>
</svg>
